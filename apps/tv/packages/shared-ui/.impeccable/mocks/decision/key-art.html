<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Key Art Drift · couch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --ground:#0A0B0E; --white:#FFFFFF; --mute:#C8CBD2; --dim:#9296A0; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:1920px; height:1080px; overflow:hidden; background:var(--ground); color:var(--white);
    font-family:'Schibsted Grotesk', sans-serif; }
  /* Stand-in for a TMDB backdrop: dunes under a dusk sky. The build loads the real image at runtime. */
  .art { position:absolute; inset:-60px; filter:blur(18px) saturate(1.05); animation:pan 40s ease-in-out infinite alternate;
    background:
      radial-gradient(30% 22% at 70% 28%, rgba(255,214,160,0.9), transparent 70%),
      linear-gradient(172deg, #2D4F73 0%, #6E7486 30%, #C9894A 52%, #8C4A26 64%, #3A1F14 80%, #160C08 100%); }
  .dune { position:absolute; left:-10%; right:-10%; border-radius:50% 50% 0 0; }
  .dune.one { top:58%; height:70%; background:#7A3E1E; }
  .dune.two { top:68%; height:60%; background:#4A2412; left:20%; }
  @keyframes pan { to { transform:translate(-50px, -16px) scale(1.06); } }
  .scrim { position:absolute; inset:0;
    background:linear-gradient(90deg, rgba(10,11,14,0.94) 0%, rgba(10,11,14,0.78) 34%, rgba(10,11,14,0.2) 70%, rgba(10,11,14,0) 100%),
               linear-gradient(0deg, rgba(10,11,14,0.85) 0%, transparent 40%); }
  header { position:absolute; left:96px; right:96px; top:58px; display:flex; justify-content:space-between; font-size:26px; font-weight:600; }
  header span:last-child { color:var(--mute); font-weight:500; }
  h1 { position:absolute; left:96px; top:330px; font-size:46px; font-weight:600; letter-spacing:-0.015em; }
  .sub { position:absolute; left:96px; top:398px; font-size:24px; color:var(--mute); }
  .row { position:absolute; left:96px; top:500px; display:flex; gap:36px; align-items:flex-start; }
  .p { width:150px; display:flex; flex-direction:column; align-items:center; }
  .disc { width:150px; height:150px; border-radius:50%; background:rgba(255,255,255,0.14); display:flex; align-items:center;
    justify-content:center; font-size:50px; font-weight:600; position:relative; }
  .seated .disc { background:#E9E2D6; color:#0A0B0E; }
  .focus .disc { transform:scale(1.18); box-shadow:0 0 0 5px var(--ground), 0 0 0 10px var(--white), 0 26px 52px rgba(0,0,0,0.6); }
  .check { position:absolute; right:-4px; bottom:-4px; width:44px; height:44px; border-radius:50%; background:var(--white);
    border:4px solid var(--ground); display:flex; align-items:center; justify-content:center; }
  .check::after { content:""; width:15px; height:8px; border-left:4px solid #0A0B0E; border-bottom:4px solid #0A0B0E;
    transform:rotate(-45deg) translate(1px,-2px); }
  .age { position:absolute; left:-6px; top:-6px; padding:6px 11px; border-radius:15px; background:#0A0B0E; color:var(--white);
    font-size:20px; font-weight:700; line-height:1; }
  .plus { position:relative; width:40px; height:40px; }
  .plus::before, .plus::after { content:""; position:absolute; background:var(--white); border-radius:2px; }
  .plus::before { left:18px; top:0; width:4px; height:40px; }
  .plus::after { top:18px; left:0; height:4px; width:40px; }
  .name { margin-top:24px; font-size:24px; color:var(--dim); font-weight:500; }
  .seated .name { color:var(--white); }
  .focus .name { margin-top:40px; font-weight:600; }
  .because { position:absolute; left:96px; bottom:96px; }
  .because .t { font-size:22px; color:var(--dim); }
  .because .f { margin-top:8px; font-size:30px; font-weight:600; }
  .cta { position:absolute; right:96px; bottom:96px; height:80px; padding:0 48px; border-radius:40px; background:var(--white);
    color:#0A0B0E; font-size:28px; font-weight:600; display:flex; align-items:center; }
  .credit { position:absolute; right:96px; bottom:44px; font-size:18px; color:var(--dim); }
</style>
</head>
<body>
  <div class="art"><div class="dune one"></div><div class="dune two"></div></div>
  <div class="scrim"></div>
  <header><span>Popcorn AI</span><span>20:41</span></header>
  <h1>Who's watching tonight?</h1>
  <div class="sub">3 on the couch · Can is 9, so picks stay PG</div>
  <div class="row">
    <div class="p add"><div class="disc"><div class="plus"></div></div><div class="name">Add</div></div>
    <div class="p seated focus"><div class="disc">B<div class="check"></div></div><div class="name">Bedirhan</div></div>
    <div class="p seated"><div class="disc">A<div class="check"></div></div><div class="name">Ayse</div></div>
    <div class="p seated"><div class="disc"><span class="age">9</span>C<div class="check"></div></div><div class="name">Can</div></div>
    <div class="p"><div class="disc"><span class="age">7</span>D</div><div class="name">Deniz</div></div>
  </div>
  <div class="because">
    <div class="t">Bedirhan's favourite</div>
    <div class="f">Dune: Part Two · 2024</div>
  </div>
  <div class="cta">Popcorn</div>
  <div class="credit">Backdrop is a stand-in; the app loads it from TMDB</div>
</body>
</html>
