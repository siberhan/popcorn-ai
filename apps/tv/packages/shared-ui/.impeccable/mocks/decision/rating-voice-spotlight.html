<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Voice spotlight · how was it</title>
<style>
  :root { --ground:#0B0D12; --white:#FFFFFF; --mute:#B4BCCB; --dim:#8F98AB; --field:#1C2230; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:1920px; height:1080px; overflow:hidden; background:var(--ground); color:var(--white);
    font-family:-apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif; }
  .field { position:absolute; inset:-200px; filter:blur(170px); }
  .blob { position:absolute; border-radius:50%; }
  .blob.one { width:900px; height:700px; left:710px; top:240px; background:#4A5A72; opacity:0.75; }
  .blob.two { width:600px; height:500px; left:1300px; top:600px; background:#96582E; opacity:0.3; }
  header { position:absolute; left:96px; right:96px; top:54px; display:flex; justify-content:space-between; align-items:center; font-size:28px; font-weight:500; }
  .film { display:flex; align-items:center; gap:18px; color:var(--mute); font-size:24px; }
  /* Poster stand-in; the app shows the TMDB poster. */
  .film i { width:44px; height:66px; border-radius:6px; background:linear-gradient(160deg, #1E4E5C 0%, #C46A2A 60%, #2A1A12 100%); }
  .center { position:absolute; left:0; right:0; top:180px; text-align:center; }
  .disc { margin:0 auto; width:200px; height:200px; border-radius:50%; background:#4A5A72; display:flex; align-items:center; justify-content:center; font-size:70px; font-weight:600;
    box-shadow:0 0 0 8px var(--ground), 0 0 0 14px rgba(255,255,255,0.9), 0 30px 60px rgba(0,0,0,0.5); }
  .ask { margin-top:44px; font-size:30px; color:var(--mute); font-weight:500; }
  .quote { margin:22px auto 0; max-width:1200px; font-size:52px; line-height:1.25; font-weight:600; letter-spacing:-0.01em; }
  .quote .live { color:var(--mute); }
  .bars { margin:30px auto 0; display:flex; gap:8px; justify-content:center; align-items:center; height:50px; }
  .bars span { width:8px; border-radius:4px; background:var(--white); }
  .hand { margin:34px auto 0; display:inline-flex; height:60px; padding:0 30px; border-radius:30px; align-items:center; font-size:24px; font-weight:500; color:var(--mute); box-shadow:inset 0 0 0 2px rgba(255,255,255,0.3); }
  .progress { position:absolute; left:0; right:0; bottom:110px; display:flex; justify-content:center; gap:16px; align-items:center; font-size:24px; color:var(--mute); }
  .progress u { width:44px; height:44px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; text-decoration:none; font-size:18px; font-weight:600; color:var(--white); }
  .progress u.now { box-shadow:0 0 0 3px var(--ground), 0 0 0 5px var(--white); }
  .progress u.later { opacity:0.45; }
  .progress em { font-style:normal; font-size:20px; height:34px; padding:0 14px; border-radius:17px; background:var(--white); color:var(--ground); display:inline-flex; align-items:center; font-weight:600; }
  .hint { position:absolute; left:96px; right:96px; bottom:50px; display:flex; justify-content:space-between; font-size:22px; color:var(--dim); }
</style>
</head>
<body>
  <div class="field"><div class="blob one"></div><div class="blob two"></div></div>
  <header><span>Popcorn AI</span><span class="film"><i></i>Project Hail Mary · 23:12</span></header>
  <div class="center">
    <div class="disc">A</div>
    <div class="ask">Popcorn: "Ayse, what did you think?"</div>
    <div class="quote">"Honestly a bit long, but the friendship <span class="live">with Rocky got me…"</span></div>
    <div class="bars"><span style="height:16px"></span><span style="height:40px"></span><span style="height:28px"></span><span style="height:46px"></span><span style="height:20px"></span><span style="height:12px"></span></div>
    <div class="hand">Rate by hand instead</div>
  </div>
  <div class="progress"><u style="background:#8A5A12">B</u><em>Loved it</em><u class="now" style="background:#4A5A72">A</u><u class="later" style="background:#A3415F">C</u><span>2 of 3</span></div>
  <div class="hint"><span>Back: skip for now</span><span>Right: skip to the next person</span></div>
</body>
</html>
