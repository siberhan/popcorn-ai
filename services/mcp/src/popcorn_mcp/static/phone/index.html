<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0D12">
<title>Popcorn</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="page">
  <header class="topbar">
    <h1 class="wordmark">Popcorn</h1>
  </header>

  <!-- Favorites mode: shown when state.screen == 'favorites' -->
  <section class="fav-mode" id="fav-mode" hidden>
    <div class="fav-header">
      <h2 class="fav-title">Pick films you like</h2>
      <p class="fav-name" id="fav-name"></p>
      <div class="fav-action-row">
        <p class="fav-count" id="fav-count">0 picked, pick at least 5</p>
        <button class="pill-btn" id="fav-done" type="button" disabled>Done</button>
      </div>
    </div>

    <div class="search-box">
      <input id="fav-search" type="search" placeholder="Search films..." autocomplete="off" autocapitalize="none" enterkeyhint="search" aria-label="Search films">
    </div>

    <!-- Your picks (only when 1+ picked) -->
    <section class="fav-section" id="fav-picks-section" hidden>
      <h3 class="fav-section-title">Your picks</h3>
      <div class="fav-grid" id="fav-picks-grid"></div>
    </section>

    <!-- Results for "<query>" when search is active -->
    <section class="fav-section" id="fav-results-section" hidden>
      <h3 class="fav-section-title" id="fav-results-title">Results</h3>
      <div class="fav-grid" id="fav-results-grid"></div>
    </section>

    <!-- Empty search: Popular right now + Best of all time -->
    <div id="fav-catalog-sections">
      <!-- One list per genre of the person, filled by app.js -->
      <div id="fav-genre-sections"></div>

      <section class="fav-section" id="fav-popular-section">
        <h3 class="fav-section-title">Popular right now</h3>
        <div class="fav-grid" id="fav-popular-grid"></div>
      </section>

      <section class="fav-section" id="fav-best-section">
        <h3 class="fav-section-title">Best of all time</h3>
        <div class="fav-grid" id="fav-best-grid"></div>
      </section>
    </div>
  </section>

  <!-- Voice / Rating / Ask mode: shown when not in favorites mode -->
  <section class="voice-mode" id="voice-mode">
    <section class="turnbox">
      <p class="turn" id="turn">Press Popcorn or open the rating on the TV to talk</p>
    </section>

    <section class="stage">
      <button class="talk" id="talk" type="button" aria-label="Say what you thought" data-state="idle" disabled>
        <svg class="mic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-6a3.5 3.5 0 1 0-7 0v6A3.5 3.5 0 0 0 12 15Zm6-3.5a1 1 0 1 1 2 0A8 8 0 0 1 13 19.4V22h-2v-2.6A8 8 0 0 1 4 11.5a1 1 0 1 1 2 0 6 6 0 0 0 12 0Z"/></svg>
        <svg class="stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>
      </button>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </section>

    <section class="fallback" id="fallback" hidden>
      <p class="note">Voice is not available in this browser. Type instead.</p>
      <form id="form" class="typebox" autocomplete="off">
        <input id="text" type="text" placeholder="Type your answer" enterkeyhint="send" aria-label="Your answer">
        <button type="submit" id="send" class="pill-btn">Send</button>
      </form>
    </section>

    <p class="heard" id="heard" aria-live="off"></p>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
