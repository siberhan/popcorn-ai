<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0d12">
<title>Popcorn</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="page">
  <h1 class="wordmark">Popcorn</h1>

  <section class="who" id="who" hidden>
    <p class="who-label">Who's talking?</p>
    <div class="chips" id="chips"></div>
  </section>

  <section class="stage">
    <button class="talk" id="talk" type="button" aria-label="Talk to Popcorn" data-state="idle">
      <svg class="mic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-6a3.5 3.5 0 1 0-7 0v6A3.5 3.5 0 0 0 12 15Zm6-3.5a1 1 0 1 1 2 0A8 8 0 0 1 13 19.4V22h-2v-2.6A8 8 0 0 1 4 11.5a1 1 0 1 1 2 0 6 6 0 0 0 12 0Z"/></svg>
      <svg class="stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>
    </button>
    <p class="status" id="status" role="status" aria-live="polite">Tap and talk</p>
  </section>

  <section class="fallback" id="fallback" hidden>
    <p class="note">Voice is not available in this browser. Type instead.</p>
    <form id="form" class="typebox" autocomplete="off">
      <input id="text" type="text" placeholder="Say something to Popcorn" enterkeyhint="send" aria-label="Message">
      <button type="submit" id="send">Send</button>
    </form>
  </section>

  <p class="heard" id="heard" aria-live="off"></p>
</main>
<script src="app.js"></script>
</body>
</html>
