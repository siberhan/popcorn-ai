[project]
name = "popcorn-mcp"
version = "0.1.0"
description = "Popcorn AI MCP server: couch, taste memory, and movie recommendations"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.3.0",
    "httpx==0.28.1",
    "boto3==1.43.114",
    "uvicorn==0.54.0",
]

[project.scripts]
popcorn-mcp = "popcorn_mcp.server:main"

[dependency-groups]
dev = ["pytest", "botocore[crt]"]  # crt: needed locally for `aws login` credentials

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/popcorn_mcp"]
