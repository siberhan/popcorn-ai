[project]
name = "popcorn-agent"
version = "0.1.0"
description = "Popcorn AI voice agent service: Strands Agents SDK + OpenRouter + Polly"
requires-python = ">=3.12"
dependencies = [
    "strands-agents[openai]==1.61.1",
    "openai==2.54.0",
    "starlette==1.8.0",
    "uvicorn==0.54.0",
    "boto3==1.43.114",
    "httpx==0.28.1",
    "sse-starlette==3.5.0",
]

[project.scripts]
popcorn-agent = "popcorn_agent.server:main"

[dependency-groups]
dev = ["pytest", "botocore[crt]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/popcorn_agent"]
